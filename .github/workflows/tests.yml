name: tests

# Runs the unit tests on every push and pull request. No API keys are needed:
# the tests use fake HTTP sessions and never call DART, Naver or OpenAI.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # chromadb needs onnxruntime, which has no Python 3.15 wheel (requirements.txt)
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt   # exact versions of the team environment
      - name: Run tests
        run: python -m pytest -q
